# Configuración del canal. Todo lo que define "de qué va" la cuenta está aquí.

channel:
  name: "Datos Curiosos Diarios"
  # Tema del canal: cuanto más concreto, mejor rinde el contenido.
  niche: "curiosidades sorprendentes de ciencia, historia y naturaleza"
  language: "es"            # idioma del guion, título y descripción
  audience: "público hispanohablante de 16 a 35 años que consume vídeos cortos"
  tone: "cercano, enérgico y con humor ligero; frases cortas; nada de clickbait falso"
  # Reglas extra para el guionista (opcional)
  extra_rules:
    - "Todos los datos deben ser verificables; si hay duda, no lo incluyas."
    - "Termina con una pregunta o llamada a la acción para comentar."

video:
  width: 1080
  height: 1920
  fps: 30
  target_seconds: 45          # duración aproximada del vídeo
  music_volume: 0.12          # volumen de la música de fondo (0-1) si hay pistas en assets/music
  captions:
    font: "DejaVu Sans"
    font_size: 92
    words_per_line: 3
    primary_color: "&H00FFFFFF"     # blanco (formato ASS: &HAABBGGRR)
    highlight_color: "&H0000E5FF"   # amarillo para la palabra que suena
    outline: 6
    margin_bottom: 620              # px desde abajo (zona segura de UI de TikTok/IG)

voice:
  # Voces gratuitas de Microsoft Edge TTS. Lista: `edge-tts --list-voices`
  name: "es-ES-AlvaroNeural"
  rate: "+8%"

claude:
  model: "claude-opus-5-5"
  effort: "medium"

footage:
  provider: "pexels"
  clips_per_segment: 1

publish:
  # Plataformas activas. Las que no tengan credenciales se saltan con un aviso.
  platforms: ["youtube", "instagram", "tiktok"]
  youtube:
    privacy: "public"        # public | unlisted | private
    category_id: "27"        # 27 = Educación
  instagram:
    share_to_feed: true
    api_base: "https://graph.facebook.com/v21.0"
  tiktok:
    # Las apps de TikTok no auditadas SOLO pueden publicar en privado (SELF_ONLY).
    # Tras la auditoría de TikTok cambia a PUBLIC_TO_EVERYONE.
    privacy: "SELF_ONLY"

# Declara el contenido como generado/alterado con IA donde la plataforma lo permite.
# Las tres plataformas lo exigen para contenido sintético realista.
disclose_ai: true
