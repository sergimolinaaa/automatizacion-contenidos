<g><text x="552" y="278" text-anchor="start" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#1F2433" >1. En caso de extraordinaria</text><text x="552" y="318" text-anchor="start" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#1F2433" >y urgente necesidad, el</text><text x="552" y="358" text-anchor="start" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#1F2433" >Gobierno podrá dictar</text><text x="552" y="398" text-anchor="start" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#1F2433" >disposiciones legislativas</text><text x="552" y="438" text-anchor="start" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#1F2433" >provisionales que tomarán</text><text x="552" y="478" text-anchor="start" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#1F2433" >la forma de Decretos-leyes…</text><text x="552" y="518" text-anchor="start" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#1F2433" >2. … en el plazo de los</text><text x="552" y="558" text-anchor="start" font-family="JetBrains Mono" font-weight="800" font-size="20" fill="#1F2433" >treinta días siguientes…</text></g>
