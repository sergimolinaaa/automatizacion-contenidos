name: Vídeo diario

# Genera un vídeo nuevo de principio a fin: tema → investigación → guion e ilustraciones (Claude)
# → voz, efectos y música → vídeo y portada (Remotion). Necesita el secreto ANTHROPIC_API_KEY.
on:
  workflow_dispatch:
    inputs:
      tema:
        description: "Tema concreto (vacío = el siguiente del banco)"
        required: false
  schedule:
    - cron: "17 */2 * * *"   # un vídeo nuevo cada 2 horas (al ritmo de publicación)

permissions:
  contents: write

concurrency:
  group: diario
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Comprobar credenciales
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Falta el secreto ANTHROPIC_API_KEY; no se genera vídeo."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - if: env.SKIP != '1'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - if: env.SKIP != '1'
        run: pip install -r requirements.txt numpy
      - if: env.SKIP != '1'
        run: npm ci
        working-directory: video
      - name: Generar guion e ilustraciones
        if: env.SKIP != '1'
        run: |
          if [ -n "${{ github.event.inputs.tema }}" ]; then
            python -m autocontent generar --tema "${{ github.event.inputs.tema }}"
          else
            python -m autocontent generar
          fi
          echo "CARPETA=$(ls -d content/*/ | sort | tail -1)" >> "$GITHUB_ENV"
      - name: Renderizar vídeo y portada
        if: env.SKIP != '1'
        run: python -m autocontent render "$CARPETA"
      - name: Guardar (guion en la rama, vídeo como release)
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          slug=$(basename "$CARPETA")
          gh release create "video-$slug" "$CARPETA/video.mp4" "$CARPETA/portada.png" --title "$slug" --notes-file "$CARPETA/guion.json" --target "${GITHUB_REF_NAME}"
          rm -f "$CARPETA/video.mp4"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add content data/temas.json
          git commit -m "Vídeo diario: $slug"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
