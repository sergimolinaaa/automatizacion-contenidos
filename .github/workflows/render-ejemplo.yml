name: Render de ejemplo

on:
  workflow_dispatch:
  push:
    paths:
      - examples/**
      - content/**
      - video/src/**
      - autocontent/**
      - scripts/render_example.py
      - config.yaml
      - .github/workflows/render-ejemplo.yml

permissions:
  contents: write

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: video/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts PyYAML requests numpy
      - run: npm ci
        working-directory: video
      - name: Renderizar guiones nuevos o modificados
        run: python scripts/render_queue.py "${{ github.event.before }}" ${{ github.event_name == 'workflow_dispatch' && '--todo' || '' }}
      - name: Guardar el vídeo en la rama
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add previews/*-con-voz.*
          git commit -m "Render de ejemplos con voz" || exit 0
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
