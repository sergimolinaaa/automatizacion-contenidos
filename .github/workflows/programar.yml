name: Programar en Buffer

# Programa en Buffer (YouTube, Instagram y TikTok) los vídeos renderizados que aún no lo están,
# uno cada 2 horas y alternando categorías. Se ejecuta tras cada render y también a mano.
# Secretos: BUFFER_API_KEY, MEDIA_TOKEN (token con escritura en el repo público de vídeos).
# Variable: MEDIA_REPO (p. ej. "usuario/eltrucoes-videos").
on:
  schedule:
    - cron: "37 */2 * * *"   # cada 2 horas rellena la cola de Buffer (máx. 8 por canal)
  workflow_dispatch:
    inputs:
      n:
        description: "Máximo de vídeos a programar (vacío = todos)"
        required: false
  workflow_run:
    workflows: ["Render de ejemplo", "Vídeo diario"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: programar
  cancel-in-progress: false

jobs:
  programar:
    # Solo tras un render que haya terminado bien (no si se canceló o falló).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      # Por defecto los vídeos se alojan en las releases de ESTE repo (debe ser público).
      # Con un repo público aparte: variable MEDIA_REPO + secreto MEDIA_TOKEN.
      GH_TOKEN: ${{ secrets.MEDIA_TOKEN || github.token }}
      MEDIA_REPO: ${{ vars.MEDIA_REPO || github.repository }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Comprobar credenciales
        run: |
          missing=""
          [ -z "$BUFFER_API_KEY" ] && missing="$missing BUFFER_API_KEY"
          vis=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$MEDIA_REPO" | python3 -c "import sys,json; print(json.load(sys.stdin).get('visibility','?'))")
          echo "Repo de vídeos: $MEDIA_REPO ($vis)"
          [ "$vis" != "public" ] && missing="$missing REPO_PUBLICO($MEDIA_REPO es $vis)"
          [ -n "$ANTHROPIC_API_KEY" ] && echo "ANTHROPIC_API_KEY: configurada" || echo "ANTHROPIC_API_KEY: falta"
          if [ -n "$missing" ]; then
            echo "::warning::Faltan:$missing — no se programa nada."
            echo "SKIP=1" >> "$GITHUB_ENV"
          else
            echo "Credenciales completas."
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
      - if: env.SKIP != '1'
        run: pip install requests PyYAML
      - if: env.SKIP != '1'
        run: python -m autocontent canales
      - if: env.SKIP != '1'
        run: python -m autocontent programar ${{ github.event.inputs.n && format('-n {0}', github.event.inputs.n) || '' }}
      - name: Guardar el estado
        if: env.SKIP != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/publicaciones.json
          git commit -m "Vídeos programados en Buffer" || exit 0
          branch="${{ github.event.workflow_run.head_branch || github.ref_name }}"
          for i in 1 2 3; do git pull --rebase origin "$branch" && git push origin "HEAD:$branch" && exit 0; sleep 5; done
          exit 1
